<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="ph-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4ECDF"/>
      <stop offset="100%" stop-color="#E8DCC8"/>
    </linearGradient>
    <linearGradient id="ph-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F2E5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8DCC8" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="url(#ph-bg)"/>

  <!-- Soft table surface -->
  <ellipse cx="600" cy="950" rx="500" ry="40" fill="#D4C5AE" opacity="0.3"/>
  <line x1="100" y1="940" x2="1100" y2="940" stroke="#C8BBA8" stroke-width="1" opacity="0.5"/>

  <!-- Light glow behind device -->
  <ellipse cx="600" cy="540" rx="280" ry="320" fill="url(#ph-light)"/>

  <!-- Device body  square block with rounded corners -->
  <g>
    <!-- Shadow under device -->
    <ellipse cx="600" cy="935" rx="220" ry="12" fill="#302C26" opacity="0.12"/>

    <!-- Ambient light strip (bottom edge) -->
    <rect x="385" y="900" width="430" height="14" rx="7" fill="#C78C59" opacity="0.4"/>
    <rect x="395" y="903" width="410" height="8" rx="4" fill="#E8B47A" opacity="0.7"/>

    <!-- Main body (front face) -->
    <rect x="380" y="360" width="440" height="540" rx="36" fill="#F8F2E5" stroke="#D4C5AE" stroke-width="2"/>

    <!-- Body top edge highlight -->
    <rect x="380" y="360" width="440" height="6" rx="3" fill="#FFFDF7" opacity="0.9"/>

    <!-- Screen area -->
    <rect x="420" y="410" width="360" height="380" rx="18" fill="#302C26"/>

    <!-- Screen inner glow -->
    <rect x="430" y="420" width="340" height="360" rx="14" fill="#3A3530"/>

    <!-- Cat face placeholder on screen -->
    <g transform="translate(600, 600)">
      <!-- Ears -->
      <path d="M -90 -120 L -60 -180 L -40 -130 Z" fill="#E8DCC8"/>
      <path d="M 90 -120 L 60 -180 L 40 -130 Z" fill="#E8DCC8"/>
      <path d="M -75 -125 L -60 -160 L -50 -130 Z" fill="#C78C59"/>
      <path d="M 75 -125 L 60 -160 L 50 -130 Z" fill="#C78C59"/>

      <!-- Face -->
      <ellipse cx="0" cy="0" rx="100" ry="90" fill="#F4ECDF"/>

      <!-- Eyes -->
      <ellipse cx="-35" cy="-10" rx="10" ry="16" fill="#302C26"/>
      <ellipse cx="35" cy="-10" rx="10" ry="16" fill="#302C26"/>
      <circle cx="-32" cy="-14" r="3" fill="#FFFDF7"/>
      <circle cx="38" cy="-14" r="3" fill="#FFFDF7"/>

      <!-- Nose -->
      <path d="M -8 18 L 8 18 L 0 26 Z" fill="#C78C59"/>

      <!-- Whiskers -->
      <line x1="-80" y1="20" x2="-30" y2="22" stroke="#756B5E" stroke-width="1"/>
      <line x1="30" y1="22" x2="80" y2="20" stroke="#756B5E" stroke-width="1"/>

      <!-- Mouth -->
      <path d="M -8 28 Q 0 35 8 28" fill="none" stroke="#756B5E" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Placeholder marker (top right) -->
  <g transform="translate(1080, 80)" opacity="0.4">
    <rect x="-60" y="-12" width="120" height="24" rx="12" fill="#A9B59A"/>
    <text x="0" y="4" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FDFAF4" letter-spacing="2">PLACEHOLDER</text>
  </g>
</svg>
