<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="ph4-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4ECDF"/>
      <stop offset="100%" stop-color="#E8DCC8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#ph4-bg)"/>

  <!-- Time display screen -->
  <g transform="translate(180, 200)">
    <rect x="-100" y="-80" width="200" height="160" rx="14" fill="#3A3530"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Inter, sans-serif" font-size="36" font-weight="300" fill="#F8F2E5" letter-spacing="2">08:42</text>
    <text x="0" y="20" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#A9B59A" letter-spacing="2">MORNING</text>
    <text x="0" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#756B5E" letter-spacing="2">t 23�</text>
  </g>

  <!-- Weather / UI display screen -->
  <g transform="translate(560, 200)">
    <rect x="-100" y="-80" width="200" height="160" rx="14" fill="#3A3530"/>
    <!-- Sun icon -->
    <circle cx="-40" cy="-30" r="18" fill="none" stroke="#C78C59" stroke-width="2"/>
    <line x1="-40" y1="-58" x2="-40" y2="-50" stroke="#C78C59" stroke-width="2"/>
    <line x1="-58" y1="-30" x2="-50" y2="-30" stroke="#C78C59" stroke-width="2"/>
    <line x1="-12" y1="-30" x2="-20" y2="-30" stroke="#C78C59" stroke-width="2"/>
    <line x1="-52" y1="-42" x2="-46" y2="-36" stroke="#C78C59" stroke-width="2"/>
    <text x="0" y="20" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#F8F2E5" letter-spacing="2">Weather</text>
    <text x="0" y="48" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#A9B59A" letter-spacing="2">Heyuan, GD</text>
  </g>

  <!-- Marker -->
  <g transform="translate(740, 30)" opacity="0.5">
    <rect x="-50" y="-10" width="100" height="20" rx="10" fill="#A9B59A"/>
    <text x="0" y="4" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#FDFAF4" letter-spacing="2">PLACEHOLDER</text>
  </g>
</svg>
