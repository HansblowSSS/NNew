<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="ph2-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4ECDF"/>
      <stop offset="100%" stop-color="#E8DCC8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#ph2-bg)"/>

  <!-- Product with screen placeholder -->
  <g transform="translate(400, 300)">
    <!-- Device body -->
    <rect x="-110" y="-110" width="220" height="220" rx="22" fill="#F8F2E5" stroke="#D4C5AE" stroke-width="1.5"/>
    <rect x="-90" y="-90" width="180" height="180" rx="12" fill="#3A3530"/>
    <!-- Simple character placeholder -->
    <circle cx="0" cy="-10" r="30" fill="#E8DCC8"/>
    <circle cx="-10" cy="-15" r="3" fill="#302C26"/>
    <circle cx="10" cy="-15" r="3" fill="#302C26"/>
    <path d="M -5 0 Q 0 5 5 0" fill="none" stroke="#756B5E" stroke-width="1.5"/>
    <!-- Light strip -->
    <rect x="-115" y="115" width="230" height="6" rx="3" fill="#C78C59" opacity="0.5"/>
  </g>

  <!-- Marker -->
  <g transform="translate(740, 40)" opacity="0.5">
    <rect x="-50" y="-10" width="100" height="20" rx="10" fill="#A9B59A"/>
    <text x="0" y="4" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#FDFAF4" letter-spacing="2">PLACEHOLDER</text>
  </g>

  <!-- Caption -->
  <text x="400" y="520" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#756B5E" letter-spacing="3">PRODUCT VISUAL</text>
</svg>
