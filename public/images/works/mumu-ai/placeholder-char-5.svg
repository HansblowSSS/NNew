    <path d="M -50 50 Q 0 70 50 50 L 60 90 L -60 90 Z" fill="#C78C59"/>
    <circle cx="0" cy="65" r="4" fill="#FFFDF7"/>
  </g>

  <g transform="translate(540, 30)" opacity="0.5">
