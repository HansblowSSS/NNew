    <text x="0" y="4" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#FDFAF4" letter-spacing="2">PLACEHOLDER</text>
  </g>
  <text x="300" y="410" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#756B5E" letter-spacing="3">ZHU MEI � 05</text>
