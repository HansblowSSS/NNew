<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="ph5-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C78C59" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C78C59" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="#302C26"/>

  <!-- Ambient glow -->
  <ellipse cx="300" cy="300" rx="260" ry="260" fill="url(#ph5-glow)"/>

  <!-- Device with light strip emphasized -->
  <g transform="translate(300, 300)">
    <rect x="-110" y="-110" width="220" height="220" rx="22" fill="#F8F2E5" stroke="#D4C5AE" stroke-width="1.5"/>
    <rect x="-90" y="-90" width="180" height="180" rx="12" fill="#1A1714"/>

    <!-- Light strip  main feature -->
    <ellipse cx="0" cy="120" rx="140" ry="18" fill="#E8B47A" opacity="0.9"/>
    <ellipse cx="0" cy="118" rx="130" ry="14" fill="#FFE0B0"/>

    <!-- Light rays -->
    <g opacity="0.3">
      <line x1="-150" y1="160" x2="-180" y2="200" stroke="#E8B47A" stroke-width="2"/>
      <line x1="-100" y1="180" x2="-110" y2="220" stroke="#E8B47A" stroke-width="2"/>
      <line x1="0" y1="190" x2="0" y2="240" stroke="#E8B47A" stroke-width="2"/>
      <line x1="100" y1="180" x2="110" y2="220" stroke="#E8B47A" stroke-width="2"/>
      <line x1="150" y1="160" x2="180" y2="200" stroke="#E8B47A" stroke-width="2"/>
    </g>

    <!-- Cat face -->
    <g transform="translate(0, -10)">
      <ellipse cx="0" cy="0" rx="60" ry="55" fill="#E8DCC8"/>
      <ellipse cx="-20" cy="-5" rx="5" ry="9" fill="#302C26"/>
      <ellipse cx="20" cy="-5" rx="5" ry="9" fill="#302C26"/>
      <path d="M -4 12 Q 0 18 4 12" fill="none" stroke="#756B5E" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Marker -->
  <g transform="translate(540, 30)" opacity="0.5">
    <rect x="-50" y="-10" width="100" height="20" rx="10" fill="#A9B59A"/>
    <text x="0" y="4" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#FDFAF4" letter-spacing="2">PLACEHOLDER</text>
  </g>

  <text x="300" y="540" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#A9B59A" letter-spacing="3">AMBIENT LIGHT</text>
</svg>
